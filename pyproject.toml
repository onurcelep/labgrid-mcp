[project]
name = "labgrid-mcp"
version = "0.1.0"
description = "MCP server exposing labgrid hardware-in-the-loop device operations to LLM agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Onur Celep" }]
dependencies = [
    "mcp>=1.2",
    "labgrid>=26.0,<27",
    "grpcio>=1.60",
]

[project.scripts]
labgrid-mcp = "labgrid_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labgrid_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["labgrid_mcp", "tests"]

[[tool.mypy.overrides]]
module = "labgrid.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs a local labgrid-coordinator"]
